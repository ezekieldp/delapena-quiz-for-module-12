name: CI/CD - Quality Check and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # Automated Quality Gate: checks JS rules natively without npm packages
      - name: Code Quality Gate (JS Semicolon Linter)
        run: |
          node -e '
            const fs = require("fs");
            const code = fs.readFileSync("src/app.js", "utf8");
            const lines = code.split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("//") && !l.endsWith("{") && !l.endsWith("}"));
            const invalid = lines.filter(l => !l.endsWith(";"));
            if (invalid.length > 0) {
              console.error("::error::Linter Rule Violation: Semicolon required at line ending:\n" + invalid.join("\n"));
              process.exit(1);
            }
            console.log("Quality Check Passed: All JS statements end with semicolons.");
          '

      # Stage static files
      - name: Package / Assemble Artifact
        run: |
          mkdir -p dist
          cp -r public/* dist/
          cp -r src/* dist/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
